
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Form | EmployEase</title>

    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>

<body class="form-page">

<div class="form-container">

    <!-- Back Navigation -->
    <a class="back-link" th:href="@{/employees}">
        <span aria-hidden="true">←</span>
        Back to Employees
    </a>

    <!-- Form Card -->
    <main class="form-card">

        <!-- Header -->
        <header class="form-header">

            <div class="form-icon" aria-hidden="true">♙</div>

            <p class="eyebrow">EMPLOYEE MANAGEMENT</p>

            <h1 th:text="${employee.id != null}
                ? 'Edit Employee'
                : 'Add New Employee'">
                Add New Employee
            </h1>

            <p class="form-description">
                Enter the details below to keep employee records
                accurate and up to date.
            </p>

        </header>

        <!-- Employee Form -->
        <form th:action="@{/save-employee}" method="post">

            <input
                    type="hidden"
                    name="id"
                    th:value="${employee.id}"
            >

            <!-- Full Name -->
            <div class="form-group">

                <label for="name">
                    Full Name <span aria-hidden="true">*</span>
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        th:value="${employee.name}"
                        placeholder="e.g. Rahul Sharma"
                        autocomplete="name"
                        maxlength="100"
                        required
                >

            </div>

            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address <span aria-hidden="true">*</span>
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        th:value="${employee.email}"
                        placeholder="rahul@example.com"
                        autocomplete="email"
                        maxlength="150"
                        required
                >

            </div>

            <!-- Department -->
            <div class="form-group">

                <label for="department">
                    Department <span aria-hidden="true">*</span>
                </label>

                <input
                        type="text"
                        id="department"
                        name="department"
                        th:value="${employee.department}"
                        placeholder="e.g. Engineering"
                        maxlength="100"
                        required
                >

            </div>

            <!-- Salary -->
            <div class="form-group">

                <label for="salary">
                    Monthly Salary (₹)
                    <span aria-hidden="true">*</span>
                </label>

                <div class="salary-input">
                    <span aria-hidden="true">₹</span>

                    <input
                            type="number"
                            id="salary"
                            name="salary"
                            th:value="${employee.salary}"
                            placeholder="e.g. 50000"
                            min="0"
                            step="0.01"
                            required
                    >
                </div>

            </div>

            <!-- Actions -->
            <div class="form-actions">

                <a
                        class="btn btn-secondary"
                        th:href="@{/employees}"
                >
                    Cancel
                </a>

                <button
                        class="btn btn-primary"
                        type="submit"
                        th:text="${employee.id != null}
                        ? 'Update Employee'
                        : 'Save Employee'"
                >
                    Save Employee
                </button>

            </div>

        </form>

    </main>

    <!-- Footer -->
    <footer class="form-note">
        <span>EmployEase</span>
        <span class="footer-separator">·</span>
        Employee Management System
    </footer>

</div>

</body>
</html>
